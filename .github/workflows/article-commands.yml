# Issue / Pull Request へのコメントで記事作成を進める
#   /ideas [テーマ]    任意の Issue で実行 → ネタ候補を生成して新しい Issue を作成（weekly-ideas.yml と同じ処理）
#   /add-idea <タイトル> 任意の Issue で実行 → 著者のアイデアを次の番号でネタ候補に追加（2 行目以降はメモ）
#   /write <番号>   ネタ候補 Issue で実行 → 下書きと撮影計画を作成し、PR を開いて自動レビュー
#   /revise <内容>  記事 PR で実行 → 修正指示・感想を反映して再レビュー
#   /review         記事 PR で実行 → 自動レビューだけをやり直す
#   /publish        記事 PR で実行 → 公開前チェック後に public/ へ移動（/publish private で限定共有のまま）
# リポジトリのオーナーのコメントだけに反応する。PR をマージすると publish.yml が Qiita に投稿する。
# PR 上のコマンドは、通常のコメントと VS Code などから送るレビューのコメントのどちらでも使える。
name: Article commands

on:
  issue_comment:
    types: [created]
  # VS Code（GitHub Pull Requests 拡張機能）の PR 画面から送ったコメントはレビューとして届く
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: article-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  COMMENT: ${{ github.event.comment.body || github.event.review.body }}
  NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  ideas:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ideas') &&
      github.event.comment.author_association == 'OWNER'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/weekly-ideas.yml
    with:
      theme: ${{ github.event.comment.body }}
      reply_to: ${{ format('{0}', github.event.issue.number) }}
    secrets:
      COPILOT_PAT: ${{ secrets.COPILOT_PAT }}

  add-idea:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/add-idea') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Add idea to issue
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null
          mkdir -p .automation-tmp
          printf '%s\n' "$COMMENT" | sed '1s#^/add-idea[[:space:]]*##' > .automation-tmp/idea.md
          if ! head -n1 .automation-tmp/idea.md | grep -q '[^[:space:]]'; then
            gh issue comment "$NUMBER" --body "使い方: \`/add-idea 記事タイトル案\`（2 行目以降に概要やメモを書けます）"
            exit 1
          fi
          gh issue view "$NUMBER" --json body -q .body > .automation-tmp/body.md
          idea_no=$(python3 scripts/blog_automation.py add-idea --body-file .automation-tmp/body.md --idea-file .automation-tmp/idea.md)
          gh label create article-idea --color 0E8A16 --description "記事のネタ候補" --force
          gh issue edit "$NUMBER" --body-file .automation-tmp/body.md --add-label article-idea
          gh issue comment "$NUMBER" --body "💡 ${idea_no} 番として追加しました。\`/write ${idea_no}\` で下書きを作成できます。"

  write:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/write') &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.issue.labels.*.name, 'article-idea')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse command
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null
          idea=$(printf '%s\n' "$COMMENT" | head -n1 | sed -nE 's#^/write[[:space:]]+([0-9]+).*#\1#p')
          if [ -z "$idea" ]; then
            gh issue comment "$NUMBER" --body "使い方: \`/write 番号\`（例: \`/write 2\`）"
            echo "HANDLED=true" >> "$GITHUB_ENV"
            exit 1
          fi
          mkdir -p .automation-tmp
          gh issue view "$NUMBER" --json body -q .body > .automation-tmp/ideas.md
          printf '%s\n' "$COMMENT" | tail -n +2 > .automation-tmp/extra-note.md
          today=$(TZ=Asia/Tokyo date +%Y%m%d)
          {
            echo "IDEA_NUMBER=$idea"
            echo "TODAY=$today"
            echo "IDEAS_FILE=$GITHUB_WORKSPACE/.automation-tmp/ideas.md"
            echo "EXTRA_NOTE_FILE=$GITHUB_WORKSPACE/.automation-tmp/extra-note.md"
            echo "BRANCH=article/$today-issue$NUMBER-$idea"
          } >> "$GITHUB_ENV"

      - name: Create branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

      - name: Write draft
        uses: ./.github/actions/copilot-run
        with:
          prompt-file: .github/automation/prompts/draft.md
          token: ${{ secrets.COPILOT_PAT }}

      - name: Commit draft
        run: |
          git add drafts/
          git diff --cached --quiet && { echo "::error::下書きが作成されませんでした"; exit 1; }
          git commit -m "下書き: ネタ候補 #$NUMBER の $IDEA_NUMBER 番"
          article=$(python3 scripts/blog_automation.py find-article --base origin/main)
          title=$(sed -nE 's/^title:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/p' "$article" | head -n1)
          case "$title" in ">"*|"|"*) title="" ;; esac
          {
            echo "ARTICLE=$article"
            echo "TITLE=$title"
            echo "OUTPUT_FILE=$GITHUB_WORKSPACE/.automation-tmp/review.md"
          } >> "$GITHUB_ENV"

      - name: Review draft
        uses: ./.github/actions/copilot-run
        with:
          prompt-file: .github/automation/prompts/review.md
          token: ${{ secrets.COPILOT_PAT }}

      - name: Open pull request
        run: |
          git push -u origin "$BRANCH"
          gh label create article-draft --color 1D76DB --description "記事の下書き PR" --force
          cat > .automation-tmp/pr-body.md <<EOF
          ネタ候補 #$NUMBER の $IDEA_NUMBER 番から作成した下書きです。

          - 記事: \`$ARTICLE\`
          - 撮影計画: \`${ARTICLE%.md}.shot-plan.md\`

          ### 次の操作
          1. 自動レビューのコメントを確認する
          2. 修正指示や感想を \`/revise 内容\` とコメントする（何度でも可）。\`/review\` でレビューだけやり直せます
          3. ローカルの VS Code で \`/capture-screenshots\` を実行し、スクリーンショットをこのブランチに push する
          4. \`/publish\` とコメントすると公開前チェックを行い、記事を \`public/\` に移動します（\`/publish private\` なら限定共有のまま）
          5. この PR をマージすると Qiita に投稿されます
          EOF
          pr_url=$(gh pr create --base main --head "$BRANCH" --title "記事: ${TITLE:-ネタ候補 #$NUMBER-$IDEA_NUMBER}" \
            --label article-draft --body-file .automation-tmp/pr-body.md)
          { echo "<!-- article-review -->"; echo "## 自動レビュー"; echo; cat "$OUTPUT_FILE"; } > .automation-tmp/review-comment.md
          gh pr comment "$pr_url" --body-file .automation-tmp/review-comment.md
          gh issue comment "$NUMBER" --body "下書きを作成しました: $pr_url"

      - name: Report failure
        if: failure() && env.HANDLED != 'true'
        run: gh issue comment "$NUMBER" --body "❌ 下書きの作成に失敗しました。[実行ログ]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) を確認してください。"

  pr-command:
    if: >-
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER') ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.author_association == 'OWNER')) &&
      (startsWith(github.event.comment.body || github.event.review.body, '/revise') ||
       startsWith(github.event.comment.body || github.event.review.body, '/review') ||
       startsWith(github.event.comment.body || github.event.review.body, '/publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare
        run: |
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null
          else
            gh pr comment "$NUMBER" --body "👀 レビューのコメントを受け付けました（\`$(printf '%s\n' "$COMMENT" | head -n1 | awk '{print $1}')\`）。処理が終わると結果をコメントします。"
          fi
          state=$(gh pr view "$NUMBER" --json state,headRefName -q '.state + " " + .headRefName')
          case "$state" in
            "OPEN article/"*) ;;
            *) gh pr comment "$NUMBER" --body "このコマンドは、自動作成された記事 PR（article/ ブランチ）が開いているときだけ使えます。"
               echo "HANDLED=true" >> "$GITHUB_ENV"; exit 1 ;;
          esac
          gh pr checkout "$NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p .automation-tmp
          cmd=$(printf '%s\n' "$COMMENT" | head -n1 | awk '{print $1}')
          article=$(python3 scripts/blog_automation.py find-article --base origin/main)
          {
            echo "CMD=$cmd"
            echo "ARTICLE=$article"
            echo "PLAN=${article%.md}.shot-plan.md"
          } >> "$GITHUB_ENV"

      # ---------- /revise ----------
      - name: Prepare revise
        if: env.CMD == '/revise'
        run: |
          printf '%s\n' "$COMMENT" | sed '1s#^/revise[[:space:]]*##' > .automation-tmp/feedback.md
          if [ "$GITHUB_EVENT_NAME" = pull_request_review ]; then
            # VS Code で記事の行に付けたコメント（同じレビューに含まれるもの）も修正指示として渡す
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews/${{ github.event.review.id }}/comments" \
              | python3 scripts/blog_automation.py review-comments >> .automation-tmp/feedback.md
          fi
          if ! grep -q '[^[:space:]]' .automation-tmp/feedback.md; then
            gh pr comment "$NUMBER" --body "使い方: \`/revise 修正してほしい内容や感想\`（複数行可）"
            echo "HANDLED=true" >> "$GITHUB_ENV"
            exit 1
          fi
          gh pr view "$NUMBER" --json comments \
            -q '[.comments[] | select(.body | contains("<!-- article-review -->"))] | last | .body // ""' \
            > .automation-tmp/last-review.md
          {
            echo "FEEDBACK_FILE=$GITHUB_WORKSPACE/.automation-tmp/feedback.md"
            echo "REVIEW_FILE=$GITHUB_WORKSPACE/.automation-tmp/last-review.md"
            echo "OUTPUT_FILE=$GITHUB_WORKSPACE/.automation-tmp/revise-summary.md"
          } >> "$GITHUB_ENV"

      - name: Apply feedback
        if: env.CMD == '/revise'
        uses: ./.github/actions/copilot-run
        with:
          prompt-file: .github/automation/prompts/revise.md
          token: ${{ secrets.COPILOT_PAT }}

      - name: Commit revision
        if: env.CMD == '/revise'
        run: |
          git add -- "$ARTICLE"
          [ -f "$PLAN" ] && git add -- "$PLAN"
          if git diff --cached --quiet; then
            echo "（記事に変更はありませんでした）" >> "$OUTPUT_FILE"
          else
            git commit -m "修正: PR #$NUMBER のフィードバックを反映"
            git push
          fi
          { echo "## フィードバックの反映結果"; echo; cat "$OUTPUT_FILE"; } > .automation-tmp/revise-comment.md
          gh pr comment "$NUMBER" --body-file .automation-tmp/revise-comment.md

      # ---------- /revise と /review の後の自動レビュー ----------
      - name: Prepare review
        if: env.CMD == '/revise' || env.CMD == '/review'
        run: echo "OUTPUT_FILE=$GITHUB_WORKSPACE/.automation-tmp/review.md" >> "$GITHUB_ENV"

      - name: Review article
        if: env.CMD == '/revise' || env.CMD == '/review'
        uses: ./.github/actions/copilot-run
        with:
          prompt-file: .github/automation/prompts/review.md
          token: ${{ secrets.COPILOT_PAT }}

      - name: Post review
        if: env.CMD == '/revise' || env.CMD == '/review'
        run: |
          { echo "<!-- article-review -->"; echo "## 自動レビュー"; echo; cat "$OUTPUT_FILE"; } > .automation-tmp/review-comment.md
          gh pr comment "$NUMBER" --body-file .automation-tmp/review-comment.md

      # ---------- /publish ----------
      - name: Move to public
        if: env.CMD == '/publish'
        run: |
          case "$ARTICLE" in
            public/*)
              gh pr comment "$NUMBER" --body "記事はすでに \`public/\` にあります。この PR をマージすると Qiita に投稿されます。"
              exit 0 ;;
          esac
          opt=""
          printf '%s\n' "$COMMENT" | head -n1 | grep -qw private && opt="--private"
          if ! python3 scripts/blog_automation.py publish "$ARTICLE" $opt > .automation-tmp/publish.log 2>&1; then
            { echo "❌ 公開前チェックで問題が見つかりました。修正してから再度 \`/publish\` してください。"; echo; echo '```text'; cat .automation-tmp/publish.log; echo '```'; } > .automation-tmp/publish-comment.md
            gh pr comment "$NUMBER" --body-file .automation-tmp/publish-comment.md
            echo "HANDLED=true" >> "$GITHUB_ENV"
            exit 1
          fi
          dest=$(tail -n1 .automation-tmp/publish.log)
          [ -f "$PLAN" ] && git rm -q -- "$PLAN"
          git add -- "$dest"
          git commit -m "公開準備: $dest"
          git push
          visibility=$([ -n "$opt" ] && echo "限定共有（private: true）" || echo "公開（private: false）")
          gh pr comment "$NUMBER" --body "✅ 公開前チェックに合格し、\`$dest\` に移動しました（$visibility）。画像のリンクは GitHub 上の URL に置き換えています。この PR をマージすると Qiita に投稿されます。"

      - name: Report failure
        if: failure() && env.HANDLED != 'true'
        run: gh pr comment "$NUMBER" --body "❌ \`$CMD\` の処理に失敗しました。[実行ログ]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) を確認してください。"
